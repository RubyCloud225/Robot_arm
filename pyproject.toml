[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-sim"
version = "0.1.0"
description = "A MuJoCo robot-arm pick-and-place simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mujoco>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
robot-arm-sim = "robot_arm_sim.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_arm_sim = ["assets/*.toml", "assets/*.xml"]
